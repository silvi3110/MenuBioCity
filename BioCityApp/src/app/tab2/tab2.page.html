<ion-header>
  <ion-toolbar color="light">
    <ion-title class="titulo-centrado">Agregar Nota</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form>
    <ion-item>
      <ion-label position="floating">Título</ion-label>
      <ion-input [(ngModel)]="nuevaNota.titulo" name="titulo"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Descripción</ion-label>
      <ion-textarea [(ngModel)]="nuevaNota.descripcion" name="descripcion"></ion-textarea>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Autor</ion-label>
      <ion-input [(ngModel)]="nuevaNota.autor" name="autor"></ion-input>
    </ion-item>

    <ion-item>
      <input type="file" (change)="onImageSelected($event)" />
    </ion-item>

    <ion-button expand="block" color="success" (click)="guardarNota()">Guardar</ion-button>
  </form>
</ion-content>
